services:
 api:
  build: .
  env_file: .env
  ports: ['8000:8000']
  depends_on: [postgres,redis]
 postgres:
  image: postgres:16-alpine
  environment: POSTGRES_USER: manager
  POSTGRES_PASSWORD: manager
  POSTGRES_DB: manager_data
  volumes: [pgdata:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
volumes: {pgdata:}
