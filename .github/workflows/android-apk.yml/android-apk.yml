name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Extract project bundle
        run: tar -xzf manager-data-ai-android-project.tar.gz
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-data-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

